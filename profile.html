<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Profilo utente - Alioune Diagne Developer Portfolio. Visualizza e modifica le informazioni del tuo account.">
  <meta name="keywords" content="profilo, developer, portfolio, Alioune Diagne">
  <meta name="author" content="Alioune Diagne">

  <!-- Area riservata: non indicizzare -->
  <meta name="robots" content="noindex, nofollow">

  <title>Profile - AD.dev Portfolio</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav id="navbar" class="navbar" aria-label="Navigazione principale"></nav>
  </header>

  <main class="section">
    <div class="container">

      <!-- I due blocchi partono nascosti (.hidden). profile.js mostra
           quello giusto in base a Auth.isLoggedIn(). -->

      <!-- Visibile solo da loggati -->
      <div id="auth-content" class="hidden">

        <!-- Riempiti da profile.js -->
        <div id="profile-header"></div>
        <section id="profile-details"></section>

        <!-- Editor profilo, aperto dal bottone "Modifica Profilo" -->
        <section id="edit-section" class="hidden">
          <div class="card mt-3">
            <h3>Modifica Profilo</h3>

            <form id="editProfileForm" class="mt-2">

              <div class="form-group">
                <label for="editName">Nome completo</label>
                <input type="text" id="editName" name="name" required>
                <span class="form-error" id="nameError">Il nome e' obbligatorio.</span>
              </div>

              <div class="form-group">
                <label for="editEmail">Email</label>
                <input type="email" id="editEmail" name="email" required>
                <span class="form-error" id="emailError">Inserisci un indirizzo email valido.</span>
              </div>

              <div class="form-group">
                <label for="editRole">Ruolo</label>
                <input type="text" id="editRole" name="role" required>
                <span class="form-error" id="roleError">Il ruolo e' obbligatorio.</span>
              </div>

              <div class="form-actions">
                <button type="submit" class="btn btn--primary">Salva modifiche</button>
                <button type="button" class="btn btn--outline" id="cancelEditBtn">Annulla</button>
              </div>
            </form>
          </div>
        </section>

      </div>

      <!-- Visibile da non loggati -->
      <div id="guest-content" class="auth-required hidden">
        <h2>Accesso richiesto</h2>
        <p>Please log in to view your profile.</p>
        <a href="login.html" class="btn btn--primary">Vai al Login</a>
      </div>

    </div>
  </main>

  <footer id="footer" class="footer"></footer>

  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>

</body>
</html>
